<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ಕರ್ನಾಟಕ ಶಾಲೆಗಳಿಗಾಗಿ ಸರಳ ಕನ್ನಡ ಲೆಟರ್ ಹೆಡ್ ರಚಿಸುವ ಉಚಿತ ಸಾಧನ">
<title>ಶ್ರೀ ಎಸ್ ಆರ್ ಅಂಗಡಿ ಅವರಿಂದ<
<style>
  *{box-sizing:border-box}
  @page{size:A4;margin:0}
  body{
    margin:0;
    font-family:"Noto Sans Kannada","Tunga","Nirmala UI",Arial,sans-serif;
    background:#eef1f4;color:#111;
  }
  header{
    background:#fff;border-bottom:1px solid #ddd;padding:16px 20px;
    text-align:center;
  }
  header .brand{font-size:21px;font-weight:800}
  header .tagline{font-size:13px;color:#666;margin-top:4px}
  .app{max-width:1250px;margin:auto;padding:20px}
  .intro{
    text-align:center;margin-bottom:18px
  }
  .intro h1{margin:0 0 6px;font-size:25px}
  .intro p{margin:0;color:#555;font-size:14px}
  .workspace{
    display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start
  }
  .panel{
    background:#fff;border-radius:12px;padding:22px;
    box-shadow:0 2px 14px rgba(0,0,0,.08)
  }
  .panel h2{font-size:19px;margin:0 0 5px}
  .instruction{font-size:13px;color:#666;line-height:1.55;margin:0 0 17px}
  label{display:block;font-weight:700;font-size:15px;margin:14px 0 7px}
  input{
    width:100%;padding:11px 12px;border:1px solid #bbb;border-radius:7px;
    font:16px "Noto Sans Kannada","Tunga","Nirmala UI",Arial,sans-serif;
    outline:none;background:#fff
  }
  input:focus{border-color:#555}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  button{
    padding:11px 8px;border:0;border-radius:7px;font-family:inherit;
    font-size:15px;font-weight:700;cursor:pointer
  }
  .print{background:#222;color:#fff}
  .reset{background:#e8e8e8;color:#111}
  button:hover{opacity:.88}
  .tip{margin-top:14px;padding:11px;border-radius:7px;background:#f5f5f5;
       font-size:12px;line-height:1.55;color:#555}
  .preview-area{
    display:flex;justify-content:center;overflow:auto;padding:5px
  }
  .a4{
    position:relative;width:794px;height:1123px;flex:0 0 auto;
    background:#fff;padding:48px 62px;
    box-shadow:0 4px 22px rgba(0,0,0,.16)
  }
  .gov-line{
    text-align:center;font-size:16px;font-weight:600;line-height:1.4;
    white-space:nowrap
  }
  .school-name{
    text-align:center;margin-top:8px;font-size:22px;font-weight:800;
    line-height:1.5;min-height:33px;word-break:break-word
  }
  .tq-dist{
    text-align:center;margin-top:7px;font-size:15px;font-weight:600;
    line-height:1.5;word-break:break-word
  }
  .double-line{
    margin-top:9px;border-top:3px solid #111;border-bottom:1px solid #111;height:7px
  }
  .letter-body{margin-top:30px}
  .footer{
    position:absolute;left:62px;right:62px;bottom:28px;
    border-top:1px solid #111;padding-top:7px;font-size:13px;font-weight:600
  }
  footer{
    text-align:center;color:#777;font-size:12px;padding:18px
  }

  /* Tablet/mobile */
  @media(max-width:900px){
    .app{padding:14px}
    .workspace{grid-template-columns:1fr}
    .preview-area{justify-content:flex-start;padding:0;overflow-x:auto}
    .panel{padding:18px}
  }
  @media(max-width:560px){
    header .brand{font-size:18px}
    .intro h1{font-size:21px}
    .buttons{grid-template-columns:1fr}
    .preview-area{margin:0 -14px;padding:0 14px}
    .a4{
      transform-origin:top left;
      /* A4 remains true-size; users can scroll horizontally on small screens */
    }
  }

  /* Printing: only the A4 sheet is printed */
  @media print{
    body{background:#fff}
    header,.intro,.panel,footer{display:none!important}
    .app{padding:0;max-width:none}
    .workspace{display:block}
    .preview-area{display:block;overflow:visible;padding:0}
    .a4{
      width:210mm;height:297mm;padding:12.7mm 16.4mm;
      box-shadow:none
    }
    .gov-line{font-size:16px}
    .school-name{font-size:22px}
    .tq-dist{font-size:15px}
    .footer{left:16.4mm;right:16.4mm;bottom:7mm}
  }
</style>
</head>
<body>

<header>
  <div class="brand">ಕರ್ನಾಟಕ ಶಾಲಾ ಲೆಟರ್ ಹೆಡ್ ರಚನೆ</div>
  <div class="tagline">ಶಾಲೆಗಳಿಗಾಗಿ ಸರಳ ಮತ್ತು ಉಚಿತ ಕನ್ನಡ ಲೆಟರ್ ಹೆಡ್ ತಯಾರಿಸುವ ಸಾಧನ ಶ್ರೀ ಎಸ್ ಆರ್ ಅಂಗಡಿ ಅವರಿಂದ.</div>
</header>

<div class="app">
  <div class="intro">
    <h1>ಶಾಲಾ ಲೆಟರ್ ಹೆಡ್ ರಚಿಸಿ</h1>
    <p>ಕೆಳಗಿನ ವಿವರಗಳನ್ನು ನಮೂದಿಸಿ. ಬಲಭಾಗದಲ್ಲಿ A4 ಲೆಟರ್ ಹೆಡ್ ತಕ್ಷಣ ಸಿದ್ಧವಾಗುತ್ತದೆ.</p>
  </div>

  <div class="workspace">
    <section class="panel">
      <h2>ಶಾಲೆಯ ವಿವರಗಳು</h2>
      <p class="instruction">
        1. ಶಾಲೆಯ ಹೆಸರನ್ನು ನಮೂದಿಸಿ.<br>
        2. ತಾಲ್ಲೂಕು ಮತ್ತು ಜಿಲ್ಲೆಯನ್ನು ನಮೂದಿಸಿ.<br>
        3. UDISE ಕೋಡ್ ನಮೂದಿಸಿ.<br>
        4. ಲೆಟರ್ ಹೆಡ್ ಸಿದ್ಧವಾದ ನಂತರ ಮುದ್ರಿಸಿ ಅಥವಾ PDF ಆಗಿ ಉಳಿಸಿ.
      </p>

      <label for="schoolName">ಶಾಲೆಯ ಹೆಸರು</label>
      <input id="schoolName" type="text" placeholder="ಉದಾ: ಸರ್ಕಾರಿ ಪ್ರೌಢಶಾಲೆ">

      <label for="tq">ತಾಲ್ಲೂಕು (Tq)</label>
      <input id="tq" type="text" placeholder="ತಾಲ್ಲೂಕಿನ ಹೆಸರು">

      <label for="dist">ಜಿಲ್ಲೆ (Dist)</label>
      <input id="dist" type="text" placeholder="ಜಿಲ್ಲೆಯ ಹೆಸರು">

      <label for="udise">UDISE ಕೋಡ್</label>
      <input id="udise" type="text" inputmode="numeric" placeholder="UDISE ಕೋಡ್">

      <div class="buttons">
        <button class="print" onclick="window.print()">🖨️ ಮುದ್ರಿಸಿ / PDF</button>
        <button class="reset" onclick="resetForm()">↺ ಮರುಹೊಂದಿಸಿ</button>
      </div>

      <div class="tip">
        <b>PDF ಉಳಿಸುವುದು ಹೇಗೆ?</b><br>
        “ಮುದ್ರಿಸಿ / PDF” ಒತ್ತಿ → Printer ನಲ್ಲಿ <b>Save as PDF</b> ಆಯ್ಕೆಮಾಡಿ → Save.
      </div>
    </section>

    <section class="preview-area" aria-label="A4 ಲೆಟರ್ ಹೆಡ್ ಪೂರ್ವವೀಕ್ಷಣೆ">
      <div class="a4">
        <div class="gov-line">ಕರ್ನಾಟಕ ಸರ್ಕಾರ&nbsp;&nbsp;&nbsp;&nbsp; ಶಾಲಾ ಶಿಕ್ಷಣ ಇಲಾಖೆ</div>
        <div class="school-name" id="pSchool">ಶಾಲೆಯ ಹೆಸರು</div>
        <div class="tq-dist" id="pLocation">ತಾಲ್ಲೂಕು: __________ &nbsp;&nbsp;&nbsp; ಜಿಲ್ಲೆ: __________</div>
        <div class="double-line"></div>

        <!-- ಮುಂದಿನ ಹಂತದಲ್ಲಿ ಕರ್ನಾಟಕ ಸರ್ಕಾರದ ಅಧಿಕೃತ ಲೋಗೋವನ್ನು ಇಲ್ಲಿ ಸೇರಿಸಬಹುದು. -->

        <div class="letter-body"></div>
        <div class="footer" id="pUdise">UDISE ಕೋಡ್: __________</div>
      </div>
    </section>
  </div>
</div>

<footer>
  ಕರ್ನಾಟಕ ಶಾಲಾ ಲೆಟರ್ ಹೆಡ್ ರಚನೆ
</footer>

<script>
const ids=["schoolName","tq","dist","udise"];

function updatePreview(){
  const school=document.getElementById("schoolName").value.trim();
  const tq=document.getElementById("tq").value.trim();
  const dist=document.getElementById("dist").value.trim();
  const udise=document.getElementById("udise").value.trim();

  document.getElementById("pSchool").textContent=school || "ಶಾಲೆಯ ಹೆಸರು";
  document.getElementById("pLocation").textContent=
    "ತಾಲ್ಲೂಕು: " + (tq || "__________") +
    "     ಜಿಲ್ಲೆ: " + (dist || "__________");
  document.getElementById("pUdise").textContent=
    "UDISE ಕೋಡ್: " + (udise || "__________");
}

function resetForm(){
  ids.forEach(id => document.getElementById(id).value="");
  updatePreview();
}

ids.forEach(id => document.getElementById(id).addEventListener("input",updatePreview));
</script>
</body>
</html>
